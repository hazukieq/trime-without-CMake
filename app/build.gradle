apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 33
    ndkVersion "24.0.8215888"

    defaultConfig {
        applicationId "com.hazukieq.hkrime"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 20220701
        versionName "3.2.7"
        setProperty("archivesBaseName", "trime-$versionName")
        resValue "string", "trime_url", getGitUrl()
        buildConfigField 'String', 'BUILD_INFO' , '"' + getBuildInfo() + '"'
        buildConfigField 'String', 'BUILD_VERSION' , '"' + "$versionName" + '-g'+ getGitVersion()+ '-' + getBuildDate()  +  '"'

        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters "arm64-v8a" // ,"armeabi-v7a"
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-android.txt'
            signingConfig signingConfigs.release
        }
        debug{
            minifyEnabled false
            debuggable true
        }
    }

    // 发布签名配置（密钥不随仓库分发）。查找顺序：
    //   1) 仓库根 release.properties（已 gitignore，本地开发用；见 release.properties.example）
    //   2) ~/.android-keys/hkrime-release.properties（推荐：密钥文件不在仓库内）
    //   3) 环境变量 HKREME_STORE_FILE / HKREME_STORE_PASSWORD / HKREME_KEY_ALIAS / HKREME_KEY_PASSWORD
    // 都找不到时 release 构建不签名（可用 apksigner 后置签名）。
    def signingProps = new Properties()
    def propsFile = [rootProject.file('release.properties'),
                     new File(System.getProperty('user.home'), '.android-keys/hkrime-release.properties')].find { it.exists() }
    if (propsFile != null) {
        propsFile.withInputStream { signingProps.load(it) }
        logger.lifecycle("release 签名配置: ${propsFile}")
    }
    def keyStorePath = signingProps.getProperty('storeFile') ?: System.getenv('HKREME_STORE_FILE')
    if (keyStorePath != null && !keyStorePath.trim().isEmpty()) {
        def ksFile = new File(keyStorePath.trim())
        if (!ksFile.isAbsolute()) ksFile = rootProject.file(keyStorePath.trim())
        if (ksFile.exists()) {
            android.signingConfigs.release.storeFile = ksFile
            android.signingConfigs.release.storePassword = signingProps.getProperty('storePassword') ?: System.getenv('HKREME_STORE_PASSWORD')
            android.signingConfigs.release.keyAlias = signingProps.getProperty('keyAlias') ?: System.getenv('HKREME_KEY_ALIAS') ?: 'hkrime'
            android.signingConfigs.release.keyPassword = signingProps.getProperty('keyPassword') ?: System.getenv('HKREME_KEY_PASSWORD')
            logger.lifecycle("release 签名 keystore: ${ksFile}")
        } else {
            logger.warn("release 签名跳过：keystore 不存在 -> ${ksFile}")
        }
    } else {
        logger.lifecycle('release 签名未配置（release.properties / ~/.android-keys / 环境变量均缺失），release APK 不签名')
    }

    buildFeatures {
        viewBinding true
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    namespace 'com.hazukieq.hkrime'
}

dependencies {
    implementation "com.blankj:utilcodex:1.31.1"
    implementation "com.jakewharton.timber:timber:5.0.1"
    implementation "cat.ereza:customactivityoncrash:2.4.0"
    implementation "androidx.core:core-ktx:1.9.0"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation "androidx.preference:preference-ktx:1.2.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.viewpager2:viewpager2:1.0.0"
    implementation 'androidx.fragment:fragment-ktx:1.5.6'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlin_coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlin_coroutines_version"
    implementation "com.google.android.flexbox:flexbox:3.0.0"
    //PermissionX
    implementation 'com.guolindev.permissionx:permissionx:1.7.1'
    implementation 'com.google.android.material:material:1.8.0'

    // 仪器测试（部署 / OpenCC 功能验证）
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'

    // 吐司框架：https://github.com/getActivity/Toaster
    //implementation 'com.github.getActivity:Toaster:12.0'
}
repositories {
    mavenCentral()
}

def getBuildInfo(){
    def info =  'Build: ' + getGitUser()+ ' \\nDate: ' + getBuildTime()+ ' UTC \\nCommit: '+getCommitInfo()+ ' \\nBranch: '+ getGitBranch()+ ' \\nRepository: '+ getGitUrl()
    println( info)
    return info
}

static def getBuildDate() {
    return new Date().format("yyyyMMdd", TimeZone.getTimeZone("UTC"))
}

static def getBuildTime() {
    return new Date().format("yyyy-MM-dd HH:mm", TimeZone.getTimeZone("UTC"))
}

static def getCommitInfo(){
    def text = ' git show --pretty=format:"%ci"'.execute().text.trim()
    text =  (text =~ /${"(\\n.*|\")"}/).replaceAll("").trim()
    return ' git describe'.execute().text.trim() +  ", " + text
}

static def getGitBranch(){
    def text = 'git symbolic-ref --short -q HEAD'.execute().text.trim()
    if(text.length()<1)
        return System.getenv("CI_BRANCH")
    return text
}

static def getGitVersion() {
    return 'git rev-parse --short HEAD'.execute().text.trim()
}

static def gitGitVersionCode() {
    try {
        return 'git rev-list HEAD --first-parent --count'.execute().text.trim().toInteger()
    }
    catch (ignored) {
        return 1
    }
}

static def getGitUser() {
    def name = 'git config user.name'.execute().text.trim()
    if(name.length()<1)
        return System.getenv("CI_NAME")
    return name
}

static def getGitUrl() {
    return 'git remote get-url  origin'.execute().text.trim().replaceFirst("\\.git\$","")
}
