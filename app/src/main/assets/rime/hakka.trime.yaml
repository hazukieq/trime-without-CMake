#     key_press_offset_y: 2
#     keys:
#       # 顶部留白
#       - { key_back_color: 0, width: 100, height: 7 }
#       # 第 1 行：， | nz | qt | abc | def | 退格
#       - { click: "，", long_click: "-", key_back_color: 0, width: 16 }
#       - { label: nz, atoms: [nz], long_click: "@" }
#       - { label: qt, atoms: [q, t], long_click: "`" }
#       - { label: abc, atoms: [a, b, c], long_click: Keyboard_edit }
#       - { label: def, atoms: [d, e, f], long_click: "~" }
#       - { click: BackSpace, width: 16, key_back_color: off_key_back_color, key_text_color: off_key_text_color }
#       # 第 2 行：。 | ng | ghi | kl | mno | /
#       - { key_back_color: 0, width: 100, height: 7 }
#       - { click: "。", long_click: "#", key_back_color: 0, width: 16 }
#       - { label: ng, atoms: [ng], long_click: "'" }
#       - { label: ghi, atoms: [g, h, i], long_click: "=" }
#       - { label: kl, atoms: [k, l], long_click: "_" }
#       - { label: mno, atoms: [m, n, o], long_click: "*" }
#       - { click: "/", width: 16, key_back_color: off_key_back_color, key_text_color: off_key_text_color }
#       # 第 3 行：？ | th | ps | vur | zj | 、
#       - { key_back_color: 0, width: 100, height: 7 }
