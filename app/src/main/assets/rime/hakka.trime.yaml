# ==============================================================================
# 5. 主打字键盘布局（按 keyboard/type 匹配方案）
# ==============================================================================
preset_keyboards:
  # ----------------------------------------------------------------------------
  # 5.1 客语 12 键（type: 12key，客语九宫方案默认）
  # ----------------------------------------------------------------------------
  jiugong_simp:
    name: 12键·标准客语
    type: 12key
    author: "叶月绘梨依"
    ascii_mode: 0
    full_shape: 0
    width: 17
    height: 55
    horizontal_gap: 5
    vertical_gap: 0
    key_press_offset_x: 2
    key_press_offset_y: 2
    keys:
      # 第 1 行
      - { key_back_color: 0, width: 100, height: 7 }
      - { click: "，", long_click: "-", key_back_color: 0, width: 16 }
      - { click: letter_y, long_click: "@" }
      - { click: letter_9, long_click: "`" }
      - { click: letter_a, long_click: Keyboard_edit }
      - { click: letter_e, long_click: "~" }
      - { click: BackSpace, width: 16 }

      # 第 2 行
      - { key_back_color: 0, width: 100, height: 7 }
      - { click: "。", long_click: "#", key_back_color: 0, width: 16 }
      - { click: letter_1, long_click: "'" }
      - { click: letter_i, long_click: "=" }
      - { click: letter_5, long_click: "_" }
      - { click: letter_4, long_click: "*" }
      - { click: "/", width: 16 }

      # 第 3 行
      - { key_back_color: 0, width: 100, height: 7 }
      - { click: "？", long_click: "！", key_back_color: 0, width: 16 }
      - { click: letter_w, long_click: copy }
      - { click: letter_7, long_click: paste }
      - { click: letter_3, long_click: cut }
      - { click: letter_8, long_click: "[]{Left}" }
      - { click: "、", width: 16 }

      # 第 4 行（底部功能行）
      - { key_back_color: 0, width: 100, height: 7 }
      - { click: Keyboard_bqrw, key_back_color: 0, long_click: Menu, width: 16, height: 50 }
      - { click: Keyboard_number }
      - { click: space, width: 34, key_back_color: bkg }
      - { click: Keyboard_en, composing: delimiter, long_click: IME_switch }
      - { click: Return, width: 16 }
      - { key_back_color: 0, width: 100, height: 7 }

  # ----------------------------------------------------------------------------
  # 5.2 26 键·简洁字母（type: qwerty，客语 26 键方案默认）
  # ----------------------------------------------------------------------------
  letter:
    name: 26键·简洁字母
    type: qwerty
    author: "osfans <waxaca@163.com>"
    ascii_mode: 0
    full_shape: 0
    width: 10
    height: 55
    key_press_offset_x: 2
    key_press_offset_y: 2
    keys:
      - { click: q, long_click: "`" }
      - { click: w, long_click: "@" }
      - { click: e, long_click: "#" }
      - { click: r, long_click: "$" }
      - { click: t, long_click: "%" }
      - { click: y, long_click: "^" }
      - { click: u, long_click: "&" }
      - { click: i, long_click: "*" }
      - { click: o, long_click: "(){Left}" }
      - { click: p, long_click: "|" }

      - { width: 5 }
      - { click: a, long_click: "!" }
      - { click: s, long_click: "~" }
      - { click: d, long_click: "-" }
      - { click: f, long_click: "_" }
      - { click: g, long_click: "\\" }
      - { click: h, long_click: "[]{Left}", swipe_left: "[", swipe_right: "]" }
      - { click: j, long_click: "{}{Left}", swipe_left: "{", swipe_right: "}" }
      - { click: k, long_click: ":" }
      - { click: l, long_click: ";" }
      - { width: 5 }

      - { click: Shift_L, send_bindings: false, width: 13 }
      - { click: z, long_click: "?" }
      - { click: x, long_click: cut }
      - { click: c, long_click: copy }
      - { click: v, long_click: paste }
      - { click: b, long_click: "/" }
      - { click: n, long_click: '"' }
      - { click: m, long_click: "'" }
      - { click: BackSpace, width: 17 }

      - { click: Keyboard_number, width: 14, long_click: Keyboard_symbols }
      - { click: ",", long_click: "<" }
      - { click: space, width: 35 }
      - { click: ".", long_click: ">" }
      - { click: Mode_switch, long_click: Menu, width: 14 }
      - { click: Return, width: 17 }

  # ----------------------------------------------------------------------------
  # 5.3 26 键·同文风（type: qwerty，可选全功能 26 键布局）
  # ----------------------------------------------------------------------------
  default:
    name: 26键·同文风
    type: qwerty
    author: "暖暖"
    ascii_mode: 0
    width: 10
    height: 48
    keys:
      - { click: q, long_click: 1, key_back_color: bh1, key_text_color: th1 }
      - { click: w, long_click: 2, key_back_color: bh1, key_text_color: th1 }
      - { click: e, long_click: 3, key_back_color: bh1, key_text_color: th1 }
      - { click: r, long_click: 4, key_back_color: bh1, key_text_color: th1 }
      - { click: t, long_click: 5, key_back_color: bh1, key_text_color: th1 }
      - { click: y, long_click: 6, key_back_color: bh1, key_text_color: th1 }
      - { click: u, long_click: 7, key_back_color: bh1, key_text_color: th1 }
      - { click: i, long_click: 8, key_back_color: bh1, key_text_color: th1 }
      - { click: o, long_click: 9, key_back_color: bh1, key_text_color: th1 }
      - { click: p, long_click: 0, key_back_color: bh1, key_text_color: th1 }

      - { width: 5, key_back_color: bh2, key_text_color: th2 }
      - { click: a, long_click: select_all, key_back_color: bh2, key_text_color: th2 }
      - { click: s, long_click: "@", key_back_color: bh2, key_text_color: th2 }
      - { click: d, long_click: "#", key_back_color: bh2, key_text_color: th2 }
      - { click: f, long_click: "$", key_back_color: bh2, key_text_color: th2 }
      - { click: g, long_click: "%", key_back_color: bh2, key_text_color: th2 }
      - { click: h, long_click: "!", swipe_down: "+", key_back_color: bh2, key_text_color: th2 }
      - { click: j, long_click: "&", swipe_down: "-", key_back_color: bh2, key_text_color: th2 }
      - { click: k, long_click: "*", swipe_down: "_", key_back_color: bh2, key_text_color: th2 }
      - { click: l, long_click: "(){Left}", swipe_down: "=", key_back_color: bh2, key_text_color: th2 }
      - { width: 5, key_back_color: bh2, key_text_color: th2 }

      - { click: Shift_L, composing: delimiter, width: 15, hilited_key_back_color: benter, key_back_color: bbs, key_text_color: tbs }
      - { click: z, long_click: "`", swipe_down: "[]{Left}", key_back_color: bh3, key_text_color: th3 }
      - { click: x, long_click: cut, swipe_down: "{}{Left}", key_back_color: bh3, key_text_color: th3 }
      - { click: c, long_click: copy, swipe_down: " ", key_back_color: bh3, key_text_color: th3 }
      - { click: v, long_click: paste, swipe_down: "\\", key_back_color: bh3, key_text_color: th3 }
      - { click: b, long_click: ";", key_back_color: bh3, key_text_color: th3 }
      - { click: n, long_click: ":", key_back_color: bh3, key_text_color: th3 }
      - { click: m, long_click: "?", swipe_down: "|", key_back_color: bh3, key_text_color: th3 }
      - { click: BackSpace, width: 15, key_back_color: bbs, key_text_color: tbs }

      - { click: Keyboard_number, long_click: Menu, width: 12.5 }
      - { click: Keyboard_bqsy1, ascii: Keyboard_bqsy2, long_click: Color_switch, width: 12.5, key_text_size: "18" }
      - { click: ",", label: "，", long_click: "<>{Left}", key_back_color: bh4, key_text_color: th4 }
      - { label: 空格, click: space, long_click: Keyboard_edit, swipe_left: Left, swipe_right: Right, width: 30, key_back_color: bkg, key_text_color: tkg }
      - { click: ".", label: "。", long_click: Keyboard_kao, key_back_color: bh4, key_text_color: th4 }
      - { click: Mode_switch, long_click: "?", key_text_size: "18", key_back_color: bh4, key_text_color: th4 }
      - { click: Return, swipe_up: Escape, width: 15, key_back_color: benter, key_text_color: tenter }

  # ----------------------------------------------------------------------------
  # 5.4 临时英文 26 键（12 键点「英文」切换至此，不参与方案默认布局选择）
  # ----------------------------------------------------------------------------
  qwerty_cn2en:
    name: 英文26键
    author: "osfans <waxaca@163.com>"
    ascii_mode: 1
    full_shape: 0
    width: 10
    height: 55
    key_press_offset_x: 2
    key_press_offset_y: 2
    keys:
      - { click: q, long_click: "`", swipe_up: "1" }
      - { click: w, long_click: "@", swipe_up: "2" }
      - { click: e, long_click: "#", swipe_up: "3" }
      - { click: r, long_click: "$", swipe_up: "4" }
      - { click: t, long_click: "%", swipe_up: "5" }
      - { click: y, long_click: "^", swipe_up: "6" }
      - { click: u, long_click: "&", swipe_up: "7" }
      - { click: i, long_click: "*", swipe_up: "8" }
      - { click: o, long_click: "(){Left}", swipe_up: "9", swipe_right: "+" }
      - { click: p, long_click: "|", swipe_up: "0", swipe_right: "=" }

      - { width: 5 }
      - { click: a, long_click: "!" }
      - { click: s, long_click: "~" }
      - { click: d, long_click: "-" }
      - { click: f, long_click: "_" }
      - { click: g, long_click: "\\" }
      - { click: h, long_click: "[]{Left}", swipe_left: "[", swipe_right: "]" }
      - { click: j, long_click: "{}{Left}", swipe_left: "{", swipe_right: "}" }
      - { click: k, long_click: ":" }
      - { click: l, long_click: ";" }
      - { width: 5 }

      - { click: Shift_L, send_bindings: false, width: 13 }
      - { click: z, long_click: "?" }
      - { click: x, long_click: cut }
      - { click: c, long_click: copy }
      - { click: v, long_click: paste }
      - { click: b, long_click: "/" }
      - { click: n, long_click: '"' }
      - { click: m, long_click: "'" }
      - { click: BackSpace, width: 17 }

      - { click: Keyboard_number, width: 14, long_click: Keyboard_symbols }
      - { click: ",", long_click: "<" }
      - { click: space, width: 35 }
      - { click: ".", long_click: ">" }
      - { click: Keyboard_cn, long_click: Menu, width: 14 }
      - { click: Return, width: 17 }

# ==============================================================================
# 6. 核心功能按键定义
# ==============================================================================
# 注：工具键盘切换键（Keyboard_number / edit / symbols / emoji / kaomoji / bq* / kao*）
# 以及数字键（num_1..9）、分类符号触发键均由 App 原生注册，此处仅保留核心编辑与 12 键字母键。
preset_keys:
  # 客语 12 键码位键
  letter_1: { label: ng, send: "1", functional: false }
  letter_3: { label: vur, send: "3", functional: false }
  letter_4: { label: mno, send: "4", functional: false }
  letter_5: { label: kl, send: "5", functional: false }
  letter_7: { label: ps, send: "7", functional: false }
  letter_8: { label: zj, send: "8", functional: false }
  letter_9: { label: qt, send: "9", functional: false }
  letter_a: { label: abc, send: a, functional: false }
  letter_e: { label: def, send: e, functional: false }
  letter_i: { label: ghi, send: i, functional: false }
  letter_w: { label: th, send: w, functional: false }
  letter_y: { label: nz, send: y, functional: false }

  # 基础输入与导航键
  space: { label: 空格, preview: " ", send: space, repeatable: false, functional: false }
  space1: { label: 空格, send: space, repeatable: false, functional: false }
  BackSpace: { label: 退格, preview: "⇦", send: BackSpace, repeatable: true, functional: false }
  Return: { label: 回车, send: Return, functional: false }
  Shift_L: { label: 锁定, preview: "⇪", send: Shift_L, functional: false }
  Shift_L2: { label: 选择, preview: "⇪", send: Shift_L, functional: false }
  Escape: { label: 取消, send: Escape, functional: false }
  delimiter: { label: 分词, text: "'" }
  Page_Up: { label: 上页, send: Page_Up, functional: false }
  Page_Down: { label: 下页, send: Page_Down, functional: false }

  # 光标与剪贴板编辑键
  Left: { label: "←", send: Left, repeatable: true, functional: false }
  Right: { label: "→", send: Right, repeatable: true, functional: false }
  Up: { label: "↑", send: Up, functional: false }
  Down: { label: "↓", send: Down, functional: false }
  Left1: { label: "⇦", send: Control+Left, repeatable: true, functional: false }
  Right1: { label: "⇨", send: Control+Right, repeatable: true, functional: false }
  Home: { label: 行首, send: Home, functional: false }
  End: { label: 行尾, send: End, functional: false }
  select_all: { label: 全选, send: Control+a, functional: false }
  copy: { label: 复制, send: Control+c, functional: false }
  cut: { label: 剪切, send: Control+x, functional: false }
  paste: { label: 粘贴, send: Control+v, functional: false }
  undo: { label: 撤销, send: Control+z, functional: false }
  redo: { label: 重做, send: Control+y, functional: false }

  # 键盘与模式切换键
  Keyboard_default: { label: 返回, send: Eisu_toggle, select: .default, functional: false }
  Keyboard_last: { label: 后退, send: Eisu_toggle, select: .last, functional: false }
  Keyboard_en: { label: 英文, send: Eisu_toggle, select: qwerty_cn2en, functional: false }
  Keyboard_cn: { label: 中文, send: Eisu_toggle, select: .default, functional: false }
  Mode_switch: { toggle: ascii_mode, send: Mode_switch, states: [中文, 英文], functional: false }
  IME_switch: { label: ime, send: LANGUAGE_SWITCH }
  Menu: { label: 菜单, send: Menu, functional: false }
  Color_switch: { label: 配色, send: PROG_RED, functional: false }

