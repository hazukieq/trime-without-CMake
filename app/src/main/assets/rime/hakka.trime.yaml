# ==============================================================================
# hkrime 主题配置 v5.0（客语简约主题）
# ==============================================================================
# 本文件仅负责「键盘与候选窗外观」以及「配色方案」：
# - 配色回退链已独立至 fallback_colors.yaml，每套配色仅需定义核心语义色。
# - 系统行为默认值、常见键盘布局（12键 / 26键 / 9键 / 五笔 / 笔画 / 英文 / 数字）
#   以及符号面板、文字编辑面板均由 App 原生内置并按方案按需加载。
# - 高级用户可取消文件末尾注释，按需覆盖内置布局或新建自定义键盘类型。
# ==============================================================================

config_version: "5.0"
name: 客语简约主题
author: "叶月绘梨依"

# ------------------------------------------------------------------------------
# 1. 键盘外观
# ------------------------------------------------------------------------------
keyboard:
  height: 250               # 竖屏键盘总高
  height_land: 200          # 横屏键盘总高
  horizontal_gap: 4         # 水平键距
  vertical_gap: 8           # 垂直键距
  round_corner: 12          # 按键圆角
  text_size: 24             # 主字符字号
  long_text_size: 18        # 多字标签字号
  symbol_text_size: 10      # 上标/长按提示字号
  defaults:
    12key: jiugong_simp
    qwerty: letter
    9key: pinyin_9key
    wubi: wubi_qwerty
    stroke: stroke_9key

# ------------------------------------------------------------------------------
# 2. 候选窗外观
# ------------------------------------------------------------------------------
candidate:
  height: 28                # 候选栏高度
  text_size: 22             # 候选字号
  padding: 5                # 候选内边距
  spacing: 0.5              # 候选间距
  comment_text_size: 20     # 注音字号
  comment_height: 20        # 注音高度
  comment_on_top: true      # 注音显示在候选上方

# ------------------------------------------------------------------------------
# 3. 配色方案（其余细粒度色键由 fallback_colors.yaml 自动推导）
# ------------------------------------------------------------------------------
color_scheme: default
colors:
  default:
    name: 简约浅色
    light_scheme: default
    dark_scheme: dark
    keyboard_back_color: 0xfff1f3f4
    back_color: 0xffffffff
    border_color: 0xffdadce0
    key_back_color: 0xffffffff
    key_text_color: 0xff202124
    key_symbol_color: 0xff5f6368
    off_key_back_color: 0xffe8eaed
    off_key_text_color: 0xff202124
    hilited_key_back_color: 0xff1a73e8
    hilited_key_text_color: 0xffffffff
    candidate_text_color: 0xff202124
    hilited_candidate_text_color: 0xff1a73e8
    comment_text_color: 0xff5f6368

  dark:
    name: 简约深色
    light_scheme: default
    dark_scheme: dark
    keyboard_back_color: 0xff1b1b1f
    back_color: 0xff2b2c30
    border_color: 0xff3c4043
    key_back_color: 0xff303134
    key_text_color: 0xffe8eaed
    key_symbol_color: 0xff9aa0a6
    off_key_back_color: 0xff3c4043
    off_key_text_color: 0xffe8eaed
    hilited_key_back_color: 0xff8ab4f8
    hilited_key_text_color: 0xff1b1b1f
    candidate_text_color: 0xffe8eaed
    hilited_candidate_text_color: 0xff8ab4f8
    comment_text_color: 0xff9aa0a6

  classic:
    name: 暖纸护眼
    light_scheme: classic
    dark_scheme: dark
    keyboard_back_color: 0xffeae6dc
    back_color: 0xfffaf7f0
    border_color: 0xffd5cfc2
    key_back_color: 0xfffaf7f0
    key_text_color: 0xff2c2924
    key_symbol_color: 0xff7a7468
    off_key_back_color: 0xffdfd9cb
    off_key_text_color: 0xff2c2924
    hilited_key_back_color: 0xff2e7d64
    hilited_key_text_color: 0xffffffff
    candidate_text_color: 0xff2c2924
    hilited_candidate_text_color: 0xff1f5f4a
    comment_text_color: 0xff6e695f

# ==============================================================================
# 高级自定义示例（默认注释，仅面向有定制需求的高级用户）
# ==============================================================================
# 规则：
# 1. 不接受未声明 type 的杂乱键盘（覆盖内置 english / number 除外）。
# 2. 允许覆盖已有类型布局（如覆盖 english / jiugong_simp / letter），
#    或新建自定义 type 并与方案中的 keyboard/type 对应。
#
# keyboards:
#   # 示例 A：覆盖系统内置英文 26 键
#   english:
#     name: 自定义英文26键
#     type: english
#     ascii_mode: 1
#     width: 10
#     height: 55
#     keys:
#       - { click: q, long_click: "1" }
#       - { click: w, long_click: "2" }
#       - { click: e, long_click: "3" }
#       - { click: r, long_click: "4" }
#       - { click: t, long_click: "5" }
#       - { click: y, long_click: "6" }
#       - { click: u, long_click: "7" }
#       - { click: i, long_click: "8" }
#       - { click: o, long_click: "9" }
#       - { click: p, long_click: "0" }
#       # ... 其余按键行
#
#   # 示例 B：新建自定义类型布局（需在对应 *.schema.yaml 写 keyboard: { type: my_custom }）
#   my_custom_layout:
#     name: 我的自定义布局
#     type: my_custom
#     width: 20
#     height: 55
#     keys:
#       - { click: a }
#       - { click: b }
#       - { click: c }
#       - { click: BackSpace }
#       - { click: Return }
#
# preset_keys:
#   my_key: { label: 自定义, send: a, functional: false }
