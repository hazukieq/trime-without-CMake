# ==============================================================================
# hkrime 默认主题配置（客语输入法）
# ==============================================================================
# 说明：
# - 主打字键盘（26键 / 12键）在本文件 `preset_keyboards` 中定义，并通过 `type`
#   与方案的 `keyboard/type`（qwerty / 12key）强绑定。
# - 工具键盘（数字 `number`、编辑 `edit`、符号 `symbols` / `symbolsnum` / `bqfh*`、
#   表情 `bq*`、颜文字 `kao_*`）由 App 原生内置（BuiltinKeyboards.kt），
#   本文件只需在 `utility_keyboards` 中做轻量参数微调即可。
# - 配色支持浅色 / 深色自动切换（`default` ↔ `dark`），配合系统深色模式生效。
# ==============================================================================

config_version: "4.0"
name: 客语简约主题
author: "叶月绘梨依"

# ==============================================================================
# 1. 全局外观与布局参数
# ==============================================================================
style:
  # 基础语言与按键行为
  locale: zh_CN
  auto_caps: false
  reset_ascii_mode: true
  proximity_correction: true
  vertical_correction: -5
  background_dim_amount: 0.5
  root_background: keyboard_back_color

  # 配色方案（跟随系统深色模式时自动在 default ↔ dark 之间切换）
  color_scheme: default

  # 键盘尺寸与间距
  keyboard_height: 250
  keyboard_height_land: 200
  key_width: 10.0
  key_height: 48
  horizontal_gap: 4
  vertical_gap: 8
  round_corner: 12

  # 字体大小
  key_text_size: 24
  key_long_text_size: 18
  symbol_text_size: 10
  label_text_size: 22
  text_size: 14
  candidate_text_size: 22
  comment_text_size: 20

  # 候选栏与编码提示
  horizontal: true
  candidate_padding: 5
  candidate_spacing: 0.5
  candidate_use_cursor: false
  candidate_view_height: 28
  comment_height: 20
  comment_on_top: true
  preedit_disable_touch: true

  # 回车键标签（0=跟随输入框动作）
  enter_label_mode: 0
  enter_labels:
    go: 前往
    done: 完成
    next: 下个
    pre: 上个
    search: 搜索
    send: 发送
    default: Enter

  # 悬浮窗 / 编码条基础布局
  layout:
    position: fixed
    min_length: 10
    max_length: 14
    sticky_lines: 1
    sticky_lines_land: 0
    max_entries: 5
    border: 0
    max_width: 360
    max_height: 300
    min_width: 0
    min_height: 50
    margin_x: 5
    margin_y: 5
    line_spacing: 0
    line_spacing_multiplier: 1.2
    real_margin: 3
    spacing: 0
    round_corner: 0
    alpha: 255
    elevation: 0
    movable: false
    all_phrases: false
  window:
    - { start: "", composition: "%s", end: "", letter_spacing: 0.12 }

  # 各方案类型对应的默认主键盘（供 KeyboardLayoutResolver 按 schema keyboard/type 解析）
  keyboard_defaults:
    qwerty: letter
    12key: jiugong_simp

  # 键盘列表（工具键盘 number / edit / symbols / emoji / kaomoji 由 App 自动注册并懒加载）
  keyboards:
    - .default
    - qwerty_cn2en

# ==============================================================================
# 2. 内置工具键盘轻量自定义（可选）
# ==============================================================================
# - 数字键盘（number）与编辑键盘（edit）由 App 原生内置，此处仅按需微调高度等参数。
# - 符号 / 表情 / 颜文字面板采用 App 固定原生布局（不接受主题布局编辑）；
#   如需新增分类标签或扩充词库，直接编辑或添加 /sdcard/hkrime/symbols/*.txt 即可。
utility_keyboards:
  number:
    height: 55
  edit:
    height: 39.5

# ==============================================================================
# 3. 配色回退链
# ==============================================================================
fallback_colors:
  candidate_text_color: text_color
  comment_text_color: candidate_text_color
  border_color: back_color
  candidate_separator_color: border_color
  hilited_text_color: text_color
  hilited_back_color: back_color
  hilited_candidate_text_color: hilited_text_color
  hilited_candidate_back_color: hilited_back_color
  hilited_comment_text_color: comment_text_color
  text_back_color: back_color
  hilited_key_back_color: hilited_candidate_back_color
  hilited_key_text_color: hilited_candidate_text_color
  hilited_key_symbol_color: hilited_comment_text_color
  hilited_off_key_back_color: hilited_key_back_color
  hilited_on_key_back_color: hilited_key_back_color
  hilited_off_key_text_color: hilited_key_text_color
  hilited_on_key_text_color: hilited_key_text_color
  key_back_color: back_color
  key_border_color: border_color
  key_text_color: candidate_text_color
  key_symbol_color: comment_text_color
  keyboard_back_color: border_color
  label_color: candidate_text_color
  off_key_back_color: key_back_color
  off_key_text_color: key_text_color
  on_key_back_color: hilited_key_back_color
  on_key_text_color: hilited_key_text_color
  preview_back_color: key_text_color
  preview_text_color: key_back_color
  shadow_color: border_color
  root_background: back_color
  candidate_background: back_color
  long_text_back_color: key_back_color

# ==============================================================================
# 4. 预设配色方案（支持系统深浅色自动切换）
# ==============================================================================
preset_color_schemes:
  # 浅色默认方案
  default:
    name: 简约浅色
    author: "风花絮,叶月绘梨依"
    light_scheme: default
    dark_scheme: dark

    # 背景与边框
    root_background: 0xfff1f3f4
    keyboard_back_color: 0xfff1f3f4
    back_color: 0xffffffff
    border_color: 0xffdadce0
    key_border_color: 0xffdadce0
    candidate_separator_color: 0xffffffff

    # 文字与候选
    text_color: 0xff5f6368
    text_back_color: 0xffffffff
    label_color: 0xff5f6368
    candidate_text_color: 0xff202124
    comment_text_color: 0xff5f6368
    hilited_back_color: 0xffffffff
    hilited_text_color: 0xff202124
    hilited_candidate_back_color: 0xffffffff
    hilited_candidate_text_color: 0xff202124
    hilited_comment_text_color: 0xff5f6368

    # 普通按键与按下高亮
    key_back_color: 0xffffffff
    key_text_color: 0xff202124
    key_symbol_color: 0xff5f6368
    hilited_key_back_color: 0xff1a73e8
    hilited_key_text_color: 0xffffffff
    hilited_key_symbol_color: 0xffffffff
    off_key_back_color: 0xfff1f3f4
    off_key_text_color: 0xff9aa0a6
    hilited_off_key_back_color: 0xff1a73e8
    hilited_off_key_text_color: 0xffffffff
    preview_back_color: 0xffffffff
    preview_text_color: 0xff202124

    # 语义化按键角色（空格 / 回车 / 退格 / 功能键 / 字母行）
    bkg: 0xffffffff
    tkg: 0xff202124
    benter: 0xffe8eaed
    tenter: 0xff202124
    bbs: 0xffe8eaed
    tbs: 0xff202124
    gnb: 0xffe8eaed
    gnt: 0xff202124
    bh1: 0xffffffff
    th1: 0xff202124
    bh2: 0xffffffff
    th2: 0xff202124
    bh3: 0xffffffff
    th3: 0xff202124
    bh4: 0xffffffff
    th4: 0xff202124

  # 深色方案（自动适配系统夜间模式）
  dark:
    name: 简约深色
    author: "叶月绘梨依"
    light_scheme: default
    dark_scheme: dark

    # 背景与边框
    root_background: 0xff1b1b1f
    keyboard_back_color: 0xff1b1b1f
    back_color: 0xff2b2c30
    border_color: 0xff3c4043
    key_border_color: 0xff3c4043
    candidate_separator_color: 0xff3c4043

    # 文字与候选
    text_color: 0xffbdc1c6
    text_back_color: 0xff2b2c30
    label_color: 0xff9aa0a6
    candidate_text_color: 0xffe8eaed
    comment_text_color: 0xff9aa0a6
    hilited_back_color: 0xff2b2c30
    hilited_text_color: 0xff8ab4f8
    hilited_candidate_back_color: 0xff2b2c30
    hilited_candidate_text_color: 0xff8ab4f8
    hilited_comment_text_color: 0xff9aa0a6

    # 普通按键与按下高亮
    key_back_color: 0xff303134
    key_text_color: 0xffe8eaed
    key_symbol_color: 0xff9aa0a6
    hilited_key_back_color: 0xff8ab4f8
    hilited_key_text_color: 0xff1b1b1f
    hilited_key_symbol_color: 0xff1b1b1f
    off_key_back_color: 0xff202124
    off_key_text_color: 0xff80868b
    hilited_off_key_back_color: 0xff8ab4f8
    hilited_off_key_text_color: 0xff1b1b1f
    preview_back_color: 0xff3c4043
    preview_text_color: 0xffe8eaed

    # 语义化按键角色
    bkg: 0xff303134
    tkg: 0xffe8eaed
    benter: 0xff3c4043
    tenter: 0xffe8eaed
    bbs: 0xff3c4043
    tbs: 0xffe8eaed
    gnb: 0xff3c4043
    gnt: 0xffe8eaed
    bh1: 0xff303134
    th1: 0xffe8eaed
    bh2: 0xff303134
    th2: 0xffe8eaed
    bh3: 0xff303134
    th3: 0xffe8eaed
    bh4: 0xff303134
    th4: 0xffe8eaed

  # 柔和暖纸配色（低蓝光护眼）
  classic:
    name: 暖纸护眼
    author: "叶月绘梨依"
    light_scheme: classic
    dark_scheme: dark

    root_background: 0xffeae6dc
    keyboard_back_color: 0xffeae6dc
    back_color: 0xfffaf7f0
    border_color: 0xffd5cfc2
    key_border_color: 0xffd5cfc2
    candidate_separator_color: 0xffeae6dc

    text_color: 0xff5c584f
    text_back_color: 0xfffaf7f0
    label_color: 0xff5c584f
    candidate_text_color: 0xff2c2924
    comment_text_color: 0xff6e695f
    hilited_back_color: 0xfffaf7f0
    hilited_text_color: 0xff2c2924
    hilited_candidate_back_color: 0xfffaf7f0
    hilited_candidate_text_color: 0xff1f5f4a
    hilited_comment_text_color: 0xff6e695f

    key_back_color: 0xfffaf7f0
    key_text_color: 0xff2c2924
    key_symbol_color: 0xff7a7468
    hilited_key_back_color: 0xff2e7d64
    hilited_key_text_color: 0xffffffff
    hilited_key_symbol_color: 0xffffffff
    off_key_back_color: 0xffeae6dc
    off_key_text_color: 0xff8f897d
    hilited_off_key_back_color: 0xff2e7d64
