
# Rime schema
# encoding: utf-8

schema:
  schema_id: hakka_jiugong
  name: 客语12键
  author:
    - 佛振 <chen.sst@gmail.com>
    - Uncle光 <467896722@qq.com>
  description: |
    「漢語拼音」，以符號按鍵 - / < \ 輸入四聲
    拼音碼表根據 CC-CEDICT 改編
  dependencies:
    - rime_ice_qwerty

keyboard:
  type: 12key
  default: jiugong_simp

switches:
  - name: simplification
    reset: 0
    states: ["简","繁"]
  - name: ywz
    reset: 1    #0为默认关闭，1为默认开启（颜文字联想：默认开启）
    states: [ 关, 颜 ]    #控制开关，可自定义括号内，开关显示内容
  - name: emoji
    reset: 1    #0为默认关闭，1为默认开启（表情联想：默认开启）
    states: [ 关, 情 ]    #表情开关
  
  #- name: full_shape
   # states: [ "全","半" ]


menu:
  # 候選條一屏條數；12 鍵面板改走全量枚舉（Rime.enumerateCandidates），
  # 此值只影響候選條/默認翻頁體驗。
  page_size: 9


engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator@custom_phrase
    - reverse_lookup_translator
    - script_translator
  filters:
    - simplifier
    - uniquifier
    - simplifier@ywz
    - simplifier@emoji

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  initials: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  multi_key: true
  suffix_only:
    - r
  algebra:
    # 有限語音/正字衍生規則（無 xlit、無鍵位替換 hack）
    - derive/w$/u/
    - derive/^q(.+)$/$1/
    - derive/am$/an/
    - derive/an$/am/
    # 有限簡拼規則：雙字母原子聲母 (th / nz / ng) + 元音外單輔音（.+ 不為單字母 r 或孤立 ng 造簡拼）
    - abbrev/^(th|nz|ng|(?!th|nz|ng)[bcdfghjklmnpqrstvwxyz]).+$/$1/
 

translator:
  dictionary: hakka
  prism: hakka_jiugong
  enable_user_dict: true
  # 純全拼長句啟用原生組句；簡拼與超長輸入（>20 音節）由補丁在引擎內跳過組句以保證性能。
  enable_sentence: true
  max_homophones: 7

  # 12 鍵的核心開關：讓每條候選的 comment = 詞典原始精確拼音（如 人→nzin、任教→nzim gau）。
  # App 端據此把候選按「實際讀音」分組（左列音節組），不再自己 DP 切分。
  # 值爲「音節數」上限（cand.code().size()），100 即全量。
  spelling_hints: 100
  always_show_comments: true
  # preedit_format 由 App 端 TwelveKeyPreedit 依 hakka.dict.yaml 反查（鍵碼→音節）

grammar:
  language: hakka-zh-hans
  collocation_max_length: 4
  collocation_min_length: 2
  collocation_penalty: -12
  non_collocation_penalty: -12
  weak_collocation_penalty: -24
  rear_penalty: -18

ywz:
  opencc_config: ywz.json
  option_name: ywz
  tips: all    #none无注释, char单字注释, all全部注释
  
emoji:
  opencc_config: emoji.json
  option_name: emoji
  tips: all    #none无注释, char单字注释, all全部注释
  

custom_phrase:
  dictionary: ""
  user_dict: custom_phrase
  db_class: tabledb
  enable_completion: true
  enable_sentence: true
  enable_encoder: true
  encode_commit_history: true
  initial_quality: "1000"

reverse_lookup:
  dictionary: rime_ice
  prefix: "`"
  suffix: "'"
  tips: 〔普通话拼音〕
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

punctuator:
  import_preset: symbols

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    punct: "^/([0-9]0?|[a-z]+)$"
    reverse_lookup: "`[a-z]*'?$"
