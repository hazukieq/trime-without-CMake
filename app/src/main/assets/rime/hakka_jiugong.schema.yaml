
# Rime schema
# encoding: utf-8

schema:
  schema_id: hakka_jiugong
  name: 客语12键
  author:
    - 佛振 <chen.sst@gmail.com>
    - Uncle光 <467896722@qq.com>
  description: |
    「漢語拼音」，以符號按鍵 - / < \ 輸入四聲
    拼音碼表根據 CC-CEDICT 改編
  dependencies:
    - rime_ice_qwerty

keyboard:
  type: 12key
  default: jiugong_simp

switches:
  - name: simplification
    reset: 0
    states: ["简","繁"]
  - name: ywz
    reset: 1    #0为默认关闭，1为默认开启（颜文字联想：默认开启）
    states: [ 关, 颜 ]    #控制开关，可自定义括号内，开关显示内容
  - name: lenth
    reset: 1    #0为默认关闭，1为默认开启（联想：默认开启）
    states: [ 关, 联 ]    #控制开关
  - name: emoji
    reset: 1    #0为默认关闭，1为默认开启（表情联想：默认开启）
    states: [ 关, 情 ]    #表情开关
  
  #- name: full_shape
   # states: [ "全","半" ]


menu:
  # 候選條一屏條數；12 鍵面板改走全量枚舉（Rime.enumerateCandidates），
  # 此值只影響候選條/默認翻頁體驗。
  page_size: 9


engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator@custom_phrase
    - reverse_lookup_translator
    - script_translator
  filters:
    - simplifier
    - uniquifier
    - simplifier@ywz
    - simplifier@lenth
    - simplifier@emoji

speller:
  alphabet: zwxyvutsrqponmlkjihgfedcba1234567890;
  initials: zxywvutsrqponmlkihgfedcba1234567890;
  delimiter: " '"
  algebra:
    #- abbrev/^([bcdfghjklmnpqstvz]).+$/$1$2/
    # 簡拼：統一的「取聲母」規則（不再逐個手寫）。
    # 聲母按拼寫長短從長到短匹配：th / nz / ng 是兩個字母，其餘取首字母；
    # 之後再經 xform/xlit，th→w、nz→y、ng→1、k/l→5、m/n→4… 落到 12 鍵上。
    # 這樣任意音節都有「聲母縮寫」，兩鍵／多鍵只打聲母也能聯想出組詞。
    - abbrev/^(th|nz|ng|[a-z]).*$/$1/
    # 12 鍵沒有獨立韻母 w 鍵（w 鍵為 th），直接歸位到 u（3 鍵）：cw→a3、zw→83
    - xform/w$/u/
    - xform/^nz/y/
    - xform/^th/w/
    - xform/^ng/1/
    - xlit/abcdefghiklmnopsuvrzjqt/aaaeeeiii55444773338899/
    #- derive/[+_*^0]//
    #- derive/([+_*^0])$//
    #- derive/^(.*)$/\U$1/
 

translator:
  dictionary: hakka
  prism: hakka
  enable_user_dict: true
  # 純全拼長句啟用原生組句；簡拼與超長輸入（>12 音節）由 0001 補丁在引擎內跳過組句以保證性能。
  enable_sentence: true

  # 12 鍵的核心開關：讓每條候選的 comment = 詞典原始精確拼音（如 人→nzin、任教→nzim gau）。
  # App 端據此把候選按「實際讀音」分組（左列音節組），不再自己 DP 切分。
  # 值爲「音節數」上限（cand.code().size()），100 即全量。
  spelling_hints: 100
  # preedit_format 由 App 端 TwelveKeyPreedit 依 hakka.dict.yaml 反查（鍵碼→音節）

ywz:
  opencc_config: ywz.json
  option_name: ywz
  tips: all    #none无注释, char单字注释, all全部注释
  
lenth:
  opencc_config: lenth.json
  option_name: lenth
  tips: none    #none无注释, char单字注释, all全部注释

emoji:
  opencc_config: emoji.json
  option_name: emoji
  tips: all    #none无注释, char单字注释, all全部注释
  

custom_phrase:
  dictionary: ""
  user_dict: custom_phrase
  db_class: tabledb
  enable_completion: true
  enable_sentence: true
  enable_encoder: true
  encode_commit_history: true
  initial_quality: "1000"

reverse_lookup:
  dictionary: rime_ice
  prefix: "`"
  suffix: "'"
  tips: 〔普通话拼音〕
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

punctuator:
  import_preset: symbols

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    punct: "^/([0-9]0?|[a-z]+)$"
    reverse_lookup: "`[a-z]*'?$"
